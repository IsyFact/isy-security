name: Auto-Changelog for Dependabot Pull Requests

on:
  pull_request_target:
    branches:
      - develop
    types: [opened, synchronize]

jobs:
  generate-changelog-entry:
    permissions:
      contents: read
    uses: IsyFact/isy-github-actions-templates/.github/workflows/dependabot_auto_changelog_template.yml@v3.0.0
